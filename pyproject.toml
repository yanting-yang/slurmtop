[project]
name = "slurmtop"
version = "0.1.0"
description = "Slurm dashboard: partitions, account/QOS limits and estimated start times"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "textual>=8,<9",
]

[project.scripts]
slurmtop = "slurmtop.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "slurmtop"
